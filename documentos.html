<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ConectaHub - Documentos</title>
</head>

<body>

<header>

    <h1>ConectaHub</h1>

    <nav>
        <a href="cliente.html">Início</a>
        <a href="meu-consorcio.html">Meu Consórcio</a>
        <a href="financeiro.html">Financeiro</a>
        <a href="atendimento.html">Atendimento</a>
        <a href="perfil.html">Perfil</a>
    </nav>

</header>

<main>

    <h2>Meus Documentos</h2>

    <section>

        <h3>Enviar documento</h3>

        <form>

            <label for="tipo-documento">
                Tipo de documento
            </label>

            <select id="tipo-documento">

                <option>RG</option>
                <option>CPF</option>
                <option>CNH</option>
                <option>Comprovante de residência</option>
                <option>Comprovante de renda</option>

            </select>

            <br><br>

            <label for="arquivo">
                Selecionar arquivo
            </label>

            <input
                type="file"
                id="arquivo"
            >

            <br><br>

            <button type="submit">
                Enviar documento
            </button>

        </form>

    </section>

    <section>

        <h2>Status dos documentos</h2>

        <table border="1">

            <thead>

                <tr>
                    <th>Documento</th>
                    <th>Data</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody>

                <tr>
                    <td>CNH</td>
                    <td>20/09/2026</td>
                    <td>Aprovado</td>
                </tr>

                <tr>
                    <td>Comprovante de residência</td>
                    <td>22/09/2026</td>
                    <td>Em análise</td>
                </tr>

                <tr>
                    <td>Comprovante de renda</td>
                    <td>-</td>
                    <td>Documento solicitado</td>
                </tr>

            </tbody>

        </table>

    </section>

</main>

<footer>
    <p>ConectaHub &copy; 2026</p>
</footer>
<script src="script.js"></script>
</body>

</html>
