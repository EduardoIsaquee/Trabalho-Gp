<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ConectaHub - Meu Perfil</title>
</head>

<body>

<header>

    <h1>ConectaHub</h1>

    <nav>
        <a href="cliente.html">Início</a>
        <a href="meu-consorcio.html">Meu Consórcio</a>
        <a href="financeiro.html">Financeiro</a>
        <a href="atendimento.html">Atendimento</a>
        <a href="perfil.html">Perfil</a>
    </nav>

</header>

<main>

    <h2>Meu Perfil</h2>

    <form>

        <label for="nome">
            Nome
        </label>

        <input
            type="text"
            id="nome"
            value="João da Silva"
        >

        <br><br>

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            value="joao@email.com"
        >

        <br><br>

        <label for="telefone">
            Telefone
        </label>

        <input
            type="tel"
            id="telefone"
            value="(31) 99999-9999"
        >

        <br><br>

        <label for="endereco">
            Endereço
        </label>

        <input
            type="text"
            id="endereco"
            value="Rua Exemplo, 100"
        >

        <br><br>

        <button type="submit">
            Salvar alterações
        </button>

    </form>

    <section>

        <h2>Segurança</h2>

        <p>
            <a href="#">Alterar senha</a>
        </p>

        <p>
            <a href="#">Gerenciar preferências de comunicação</a>
        </p>

    </section>

</main>

<footer>
    <p>ConectaHub &copy; 2026</p>
</footer>
<script src="script.js"></script>
</body>

</html>
